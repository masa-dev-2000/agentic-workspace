<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live Dependency Roadmap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0a1828;
      --panel-2: #0d2133;
      --line: #30475f;
      --text: #f5f8fc;
      --muted: #91a5b8;
      --green: #3bd887;
      --gold: #f4bd4f;
      --purple: #9f7aea;
      --red: #f4bd4f;
      --blue: #62b6ff;
      --focus: #f5f8fc;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        linear-gradient(rgba(90, 118, 145, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(90, 118, 145, .035) 1px, transparent 1px),
        radial-gradient(circle at 51% 42%, rgba(44, 91, 138, .19), transparent 38%),
        var(--bg);
      background-size: 48px 48px, 48px 48px, auto, auto;
      color: var(--text);
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 18px 0 14px 5.5vw;
      gap: 4px;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 92px;
      padding: 0 5.5vw 0 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .brand { min-width: 0; margin-right: auto; }
    .brand::before {
      content: "RELEASE QUEST · DEPENDENCY ROADMAP";
      display: block;
      margin-bottom: 5px;
      color: #7890a7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .brand strong { display: block; font-size: 22px; letter-spacing: .01em; }
    .brand span, .metric small, .connection { color: var(--muted); font-size: 11px; }
    .metrics { display: flex; gap: 8px; }
    .metric {
      min-width: 108px;
      padding: 8px 12px;
      border-radius: 15px;
      background: rgba(10, 24, 40, .82);
      border: 1px solid #3a536d;
    }
    .metric:first-child { min-width: 140px; }
    .metric:first-child b { font-size: 25px; letter-spacing: .04em; }
    .metric b { display: block; margin-top: 2px; font-size: 13px; }
    .connection {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .dot.live { background: var(--green); box-shadow: 0 0 10px rgba(34,197,94,.7); }
    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 0;
    }
    .workspace {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0;
      gap: 0;
      transition: grid-template-columns .2s ease, gap .2s ease;
    }
    .workspace.pane-open {
      grid-template-columns: minmax(0, 1fr) min(400px, 34vw);
      gap: 0;
    }
    svg { display: block; width: 100%; height: 100%; }
    .edge { fill: none; stroke: var(--line); stroke-width: 2.5; marker-end: url(#arrow); }
    .edge.unverified { stroke-dasharray: 3 7; opacity: .58; }
    .edge.done { stroke: var(--green); }
    .edge.critical { stroke: var(--gold); stroke-dasharray: 10 8; animation: flow 1.1s linear infinite; }
    .node { cursor: pointer; }
    .node > rect {
      fill: rgba(10, 24, 40, .94);
      stroke: #475569;
      stroke-width: 2;
      rx: 16;
      transition: fill .18s, stroke .18s;
    }
    .node:hover > rect, .node:focus > rect { fill: var(--panel-2); stroke: var(--focus); }
    .node[data-status="done"] > rect { stroke: var(--green); }
    .node[data-status="active"] > rect { stroke: var(--blue); }
    .node[data-status="waiting"] > rect { stroke: var(--gold); }
    .node[data-status="blocked"] > rect { stroke: var(--red); }
    .node[data-status="parallel"] > rect { stroke: var(--purple); stroke-dasharray: 7 5; }
    .node.bottleneck > rect { stroke-width: 4; filter: drop-shadow(0 0 8px rgba(244,189,79,.42)); }
    .node-id { fill: #7890a7; font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    .node-title { fill: var(--text); font-size: 16px; font-weight: 800; }
    .node-sub { fill: var(--muted); font-size: 11px; }
    .node-state { font-size: 10px; font-weight: 800; letter-spacing: .08em; }
    .node-eta { fill: #dbeafe; font-size: 11px; font-weight: 650; }
    .worker-badge rect {
      fill: #172033;
      stroke: #41516a;
      stroke-width: 1;
      rx: 8;
    }
    .worker-badge text { fill: #cbd5e1; font-size: 9px; font-weight: 650; }
    .worker-dot { fill: #94a3b8; }
    .worker-dot.working {
      fill: var(--blue);
      animation: workerPulse 1.8s ease-in-out infinite;
    }
    .worker-dot.waiting { fill: var(--gold); }
    .worker-dot.stale { fill: #64748b; }
    .empty { color: var(--muted); position: absolute; inset: 0; display: grid; place-items: center; }
    .toast {
      position: absolute;
      right: 14px;
      bottom: 14px;
      max-width: min(420px, calc(100% - 28px));
      padding: 9px 12px;
      border-radius: 10px;
      background: #172033;
      border: 1px solid #334155;
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { opacity: 1; transform: none; }
    .detail-pane {
      min-width: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-left: 1px solid #475569;
      border-radius: 0;
      background: #081525;
      color: var(--text);
      box-shadow: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .16s ease, visibility .16s ease;
    }
    .workspace.pane-open .detail-pane {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .detail-head {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 16px; border-bottom: 1px solid #26344b;
    }
    .detail-heading { min-width: 0; margin-right: auto; }
    .detail-id { color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    button.detail-id {
      display: block;
      max-width: 100%;
      padding: 2px 4px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: copy;
    }
    button.detail-id:hover { color: var(--text); background: #172033; }
    .detail-heading h2 { margin: 4px 0 0; font-size: 19px; }
    .icon-button {
      width: 36px; height: 36px; flex: 0 0 auto; cursor: pointer;
      border: 1px solid #41516a; border-radius: 9px;
      color: var(--text); background: #172033;
    }
    .detail-facts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      max-height: calc(100% - 69px);
      padding: 12px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #475569 #111827;
    }
    .detail-fact {
      min-width: 0; padding: 10px;
      border: 1px solid #26344b; border-radius: 10px; background: #0f192b;
    }
    .detail-fact.wide { grid-column: 1 / -1; }
    .detail-fact small { display: block; margin-bottom: 4px; color: var(--muted); }
    .detail-fact b { font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .pane-tab {
      position: absolute;
      z-index: 6;
      right: 0;
      top: 50%;
      translate: 0 -50%;
      min-width: 42px;
      padding: 12px 8px;
      border: 1px solid #41516a;
      border-right: 0;
      border-radius: 10px 0 0 10px;
      color: var(--text);
      background: #172033;
      cursor: pointer;
      writing-mode: vertical-rl;
      letter-spacing: .08em;
    }
    .view-nav button {
      border: 1px solid rgba(98,182,255,.42); border-radius: 9px;
      padding: 8px 12px; color: var(--text); background: rgba(13,33,51,.9);
      font: inherit; cursor: pointer;
    }
    .view-nav {
      position: absolute; left: 14px; top: 6px; z-index: 4;
      display: flex; align-items: center; gap: 8px; max-width: calc(100% - 28px);
      color: var(--muted); font-size: 11px;
    }
    .view-nav span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error {
      position: absolute; inset: 0; display: none; place-items: center;
      padding: 24px; text-align: center; color: #fecdd3; background: rgba(2,6,23,.9);
    }
    .error.show { display: grid; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes workerPulse { 50% { opacity: .45; } }
    @media (max-width: 760px) {
      .shell { padding: 8px; }
      .hud {
        min-height: 104px;
        padding: 4px 6px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        align-content: start;
        gap: 6px 10px;
      }
      .brand { grid-column: 1 / -1; }
      .brand::before {
        margin-bottom: 2px;
        font-size: 8px;
        white-space: nowrap;
      }
      .brand strong {
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand span { display: block; font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .metric:nth-of-type(n+2) { display: none; }
      .metric, .metric:first-child { min-width: 92px; padding: 5px 8px; }
      .metric:first-child b { font-size: 18px; }
      .connection { justify-self: end; }
      .connection span:last-child { display: none; }
      .detail-facts { grid-template-columns: 1fr; }
      .detail-fact.wide { grid-column: auto; }
      .workspace { display: block; }
      .stage { width: 100%; height: 100%; }
      .detail-pane {
        position: absolute;
        z-index: 7;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(360px, calc(100vw - 16px));
        border-left: 1px solid #475569;
        border-radius: 0;
        transform: translateX(calc(100% + 12px));
        opacity: 1;
        visibility: visible;
        transition: transform .2s ease;
      }
      .workspace:not(.pane-open) .detail-pane { pointer-events: none; }
      .workspace.pane-open .detail-pane { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div class="brand">
        <strong id="projectName">依存関係ロードマップ</strong>
        <span id="updated">読込中</span>
      </div>
      <div class="metrics">
        <div class="metric"><small>完了</small><b id="completion">—</b></div>
        <div class="metric"><small>標準完了見込</small><b id="projectEta">—</b></div>
        <div class="metric"><small>確信度</small><b id="confidence">—</b></div>
      </div>
      <div class="connection"><i class="dot" id="liveDot"></i><span id="liveLabel">15秒ごと自動更新</span></div>
    </header>
    <div class="workspace" id="workspace">
      <section class="stage" aria-label="プロジェクト依存ロードマップ">
        <nav class="view-nav" aria-label="現在の階層">
          <button id="backLevel" type="button" hidden>一つ上へ戻る</button>
          <span id="viewCrumb">全体</span>
        </nav>
        <svg id="roadmap" role="img" aria-label="依存関係グラフ"></svg>
        <div class="empty" id="empty" hidden>表示できるタスクがありません</div>
        <div class="error" id="error" role="alert"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </section>
      <aside class="detail-pane" id="detailPane" aria-labelledby="detailTitle" aria-hidden="true">
        <header class="detail-head">
          <div class="detail-heading">
            <button class="detail-id" id="detailId" type="button" aria-label="ノードIDをコピー" title="クリックでIDをコピー"></button>
            <h2 id="detailTitle">ノード詳細</h2>
          </div>
          <button class="icon-button" id="closePane" type="button" aria-label="詳細を折り畳む">×</button>
        </header>
        <section class="detail-facts" id="detailFacts" aria-label="判断に必要な情報"></section>
      </aside>
      <button class="pane-tab" id="reopenPane" type="button" aria-label="詳細を再表示" hidden>詳細</button>
    </div>
  </main>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const state = {
      data: null, selectedId: "", viewStack: [], eventSource: null, retry: null,
      clickTimer: null, paneOpen: false
    };
    const $ = id => document.getElementById(id);
    const statusLabel = {
      done: "CLEAR", active: "ACTIVE", waiting: "確認待ち", blocked: "BLOCKED", parallel: "PARALLEL", locked: "LOCKED"
    };
    const color = {
      done: "#22c55e", active: "#62b6ff", waiting: "#fbbf24", blocked: "#fb7185", parallel: "#a78bfa", locked: "#94a3b8"
    };
    function nodeStatusLabel(node) {
      return node?.status === "waiting"
        ? node.waitingLabel || "待機中"
        : statusLabel[node?.status] || node?.status || "—";
    }
    function time(value) {
      if (!value) return "未算出";
      return new Intl.DateTimeFormat("ja-JP", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
      }).format(new Date(value));
    }
    function el(name, attrs = {}, text = "") {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text) node.textContent = text;
      return node;
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }
    const textCanvas = document.createElement("canvas");
    const textContext = textCanvas.getContext("2d");
    function fitText(value, maxWidth, font) {
      const text = String(value ?? "");
      if (!textContext || !text) return text;
      textContext.font = font;
      if (textContext.measureText(text).width <= maxWidth) return text;
      const suffix = "…";
      let low = 0;
      let high = text.length;
      while (low < high) {
        const middle = Math.ceil((low + high) / 2);
        const candidate = text.slice(0, middle) + suffix;
        if (textContext.measureText(candidate).width <= maxWidth) low = middle;
        else high = middle - 1;
      }
      return text.slice(0, low) + suffix;
    }
    const executionLabel = {
      assigned: "割当済み", working: "作業中", waiting: "待機中", stale: "更新停止", finished: "終了"
    };
    function workerSummary(executions = []) {
      const visible = executions
        .filter(item => item.state !== "finished")
        .slice(0, 3);
      if (!visible.length) return null;
      const first = visible[0];
      const remaining = executions.filter(item => item.state !== "finished").length - 1;
      return {
        label: `${first.displayName}${remaining > 0 ? ` +${remaining}` : ""}`,
        state: first.state,
      };
    }
    function layout(nodes, edges, width, height, verticalMode = false) {
      if (verticalMode) {
        const nodeWidth = width - 40;
        const nodeHeight = Math.min(104, (height - 40) / Math.max(1, nodes.length) - 12);
        const gap = Math.max(12, (height - nodes.length * nodeHeight) / (nodes.length + 1));
        return new Map(nodes.map((node, index) => [node.id, {
          x: 20,
          y: gap + index * (nodeHeight + gap),
          width: nodeWidth,
          height: nodeHeight,
        }]));
      }
      const ids = new Set(nodes.map(node => node.id));
      const incoming = new Map(nodes.map(node => [node.id, []]));
      edges.forEach(edge => ids.has(edge.from) && ids.has(edge.to) && incoming.get(edge.to).push(edge.from));
      const levels = new Map();
      function level(id, visiting = new Set()) {
        if (levels.has(id)) return levels.get(id);
        if (visiting.has(id)) return 0;
        visiting.add(id);
        const value = Math.max(-1, ...incoming.get(id).map(parent => level(parent, visiting))) + 1;
        visiting.delete(id);
        levels.set(id, value);
        return value;
      }
      nodes.forEach(node => level(node.id));
      const columns = [];
      nodes.forEach(node => {
        const index = levels.get(node.id);
        (columns[index] ||= []).push(node);
      });
      const nodeWidth = Math.min(210, Math.max(150, (width - 80) / Math.max(1, columns.length) - 34));
      const nodeHeight = 102;
      const positions = new Map();
      columns.forEach((column, columnIndex) => {
        const gapY = Math.max(18, (height - column.length * nodeHeight) / (column.length + 1));
        column.forEach((node, rowIndex) => {
          positions.set(node.id, {
            x: 40 + columnIndex * ((width - 80 - nodeWidth) / Math.max(1, columns.length - 1)),
            y: gapY + rowIndex * (nodeHeight + gapY),
            width: nodeWidth,
            height: nodeHeight,
          });
        });
      });
      return positions;
    }
    function defs(svg) {
      const definitions = el("defs");
      const marker = el("marker", {
        id: "arrow", markerWidth: 10, markerHeight: 10, refX: 8, refY: 3,
        orient: "auto", markerUnits: "strokeWidth"
      });
      marker.append(el("path", { d: "M0,0 L0,6 L9,3 z", fill: "#64748b" }));
      definitions.append(marker);
      svg.append(definitions);
    }
    function draw(svg, nodes, edges, options = {}) {
      svg.replaceChildren();
      defs(svg);
      const width = options.width || (svg.clientWidth < 500 ? 360 : 1200);
      const height = options.height || 650;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      if (!nodes.length) return;
      const verticalMode = width < 500 && nodes.length <= 6;
      const positions = layout(nodes, edges, width, height, verticalMode);
      edges.forEach(edge => {
        const from = positions.get(edge.from);
        const to = positions.get(edge.to);
        if (!from || !to) return;
        const x1 = verticalMode ? from.x + from.width / 2 : from.x + from.width;
        const y1 = verticalMode ? from.y + from.height : from.y + from.height / 2;
        const x2 = verticalMode ? to.x + to.width / 2 : to.x;
        const y2 = verticalMode ? to.y : to.y + to.height / 2;
        const curve = verticalMode
          ? Math.max(22, (y2 - y1) * .45)
          : Math.max(30, (x2 - x1) * .45);
        svg.append(el("path", {
          d: verticalMode
            ? `M${x1},${y1} C${x1},${y1 + curve} ${x2},${y2 - curve} ${x2},${y2}`
            : `M${x1},${y1} C${x1 + curve},${y1} ${x2 - curve},${y2} ${x2},${y2}`,
          class: `edge ${edge.complete ? "done" : ""} ${edge.critical ? "critical" : ""} ${edge.evidence?.verified ? "" : "unverified"}`
        }));
      });
      nodes.forEach(node => {
        const box = positions.get(node.id);
        const childIds = (node.children || []).filter(item => item !== node.id);
        const canDrill = childIds.length > 0;
        const worker = canDrill ? null : workerSummary(node.executions);
        const group = el("g", {
          class: `node ${node.bottleneck || node.id === state.data?.summary?.bottleneck ? "bottleneck" : ""}`,
          "data-status": node.status,
          tabindex: "0", role: "button",
          "aria-label": `${node.title} ${nodeStatusLabel(node)} クリックで詳細${canDrill ? " ダブルクリックで配下を表示" : ""}`
        });
        group.append(el("title", {}, `${node.title} · クリックで詳細${canDrill ? " · ダブルクリックで配下を表示" : ""}`));
        group.append(el("rect", { x: box.x, y: box.y, width: box.width, height: box.height }));
        const textWidth = Math.max(24, box.width - 26);
        if (!canDrill) {
          group.append(el("text", { x: box.x + 13, y: box.y + 18, class: "node-id" },
            fitText(
              String(node.id || "").replace(/^(project|milestone|group|batch):/, "").toUpperCase(),
              worker ? textWidth - 82 : textWidth,
              '800 10px "BIZ UDPGothic", "Yu Gothic UI", sans-serif'
            )));
        }
        group.append(el("text", { x: box.x + 13, y: box.y + (canDrill ? 31 : 39), class: "node-title" },
          fitText(
            node.title || node.id,
            worker ? textWidth - 82 : textWidth,
            '800 16px "BIZ UDPGothic", "Yu Gothic UI", sans-serif'
          )));
        if (worker) {
          const badgeWidth = Math.min(74, Math.max(48, 20 + worker.label.length * 8));
          const badge = el("g", { class: "worker-badge", "aria-hidden": "true" });
          badge.append(el("rect", {
            x: box.x + box.width - badgeWidth - 9, y: box.y + 9,
            width: badgeWidth, height: 20
          }));
          badge.append(el("circle", {
            cx: box.x + box.width - badgeWidth + 1, cy: box.y + 19, r: 3.5,
            class: `worker-dot ${worker.state}`
          }));
          badge.append(el("text", {
            x: box.x + box.width - badgeWidth + 9, y: box.y + 22
          }, worker.label.slice(0, 9)));
          group.append(badge);
        }
        group.append(el("text", {
          x: box.x + 13, y: box.y + 93, class: "node-state", fill: color[node.status] || "#fff"
        }, nodeStatusLabel(node)));
        group.append(el("text", { x: box.x + 13, y: box.y + 61, class: "node-sub" },
          fitText(
            canDrill ? `${childIds.length}件 · 配下を表示` : node.objective || node.assigneeType || "",
            textWidth,
            '600 11px "BIZ UDPGothic", "Yu Gothic UI", sans-serif'
          )));
        group.append(el("text", { x: box.x + 13, y: box.y + 78, class: "node-eta" },
          `見込 ${time(node.eta?.likely)}`));
        const queueDetail = () => {
          clearTimeout(state.clickTimer);
          state.clickTimer = setTimeout(() => openDetail(node.id), 240);
        };
        const drill = event => {
          clearTimeout(state.clickTimer);
          if (!canDrill) {
            openDetail(node.id);
            return;
          }
          event?.preventDefault();
          drillInto(node.id);
        };
        group.addEventListener("click", queueDetail);
        group.addEventListener("dblclick", drill);
        group.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openDetail(node.id);
          }
        });
        svg.append(group);
      });
    }
    function detailEdges(nodes) {
      const ids = new Set(nodes.map(node => node.id));
      return nodes.flatMap(node => (node.dependencies || [])
        .filter(id => ids.has(id))
        .map(id => ({
          from: id, to: node.id,
          critical: node.critical && state.data.nodes.find(item => item.id === id)?.critical,
          complete: state.data.nodes.find(item => item.id === id)?.sourceStatus === "done"
        })));
    }
    function detailFact(label, value, wide = false) {
      return `<div class="detail-fact${wide ? " wide" : ""}"><small>${esc(label)}</small><b>${esc(value || "—")}</b></div>`;
    }
    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }
    function setPaneOpen(open, focus = false) {
      state.paneOpen = open && Boolean(state.selectedId);
      $("workspace").classList.toggle("pane-open", state.paneOpen);
      $("detailPane").setAttribute("aria-hidden", String(!state.paneOpen));
      $("reopenPane").hidden = state.paneOpen || !state.selectedId;
      requestAnimationFrame(renderCurrentView);
      if (focus && state.paneOpen) $("closePane").focus();
    }
    function openDetail(id, preserveFocus = false) {
      const node = state.data?.nodes.find(item => item.id === id);
      if (!node) return;
      state.selectedId = id;
      $("detailId").textContent = node.id;
      $("detailTitle").textContent = node.title;
      const owner = [node.assigneeType, node.assignee].filter(Boolean).join(" / ") || "未設定";
      const impactLabel = node.status === "waiting" ? "待機理由・影響" : "阻害要因";
      $("detailFacts").innerHTML =
        detailFact("状態", nodeStatusLabel(node)) +
        detailFact("担当", owner) +
        detailFact("詳細説明", node.objective || "説明未登録", true) +
        detailFact("この工程が必要な理由", node.reason || "理由未登録", true) +
        detailFact("完了条件", node.verification || "完了条件未登録", true) +
        detailFact(impactLabel, node.blocker || node.waitReason || "なし", true) +
        detailFact("標準完了見込", time(node.eta?.likely)) +
        detailFact("最終更新", time(node.updatedAt));
      setPaneOpen(true, !preserveFocus);
    }
    function currentView() {
      if (!state.viewStack.length) return state.data?.graph || { nodes: [], edges: [] };
      const id = state.viewStack[state.viewStack.length - 1];
      const parent = state.data?.nodes.find(node => node.id === id);
      const ids = (parent?.children || []).filter(item => item !== parent.id);
      const nodes = ids.map(item => state.data.nodes.find(node => node.id === item)).filter(Boolean);
      return { nodes, edges: detailEdges(nodes) };
    }
    function renderCurrentView() {
      const view = currentView();
      const labels = state.viewStack.map(id =>
        state.data?.nodes.find(node => node.id === id)?.title || id
      );
      $("viewCrumb").textContent = ["全体", ...labels].join(" / ");
      $("backLevel").hidden = state.viewStack.length === 0;
      $("empty").hidden = view.nodes.length > 0;
      draw($("roadmap"), view.nodes, view.edges);
    }
    function drillInto(id) {
      const node = state.data?.nodes.find(item => item.id === id);
      const childIds = (node?.children || []).filter(item => item !== node.id);
      if (!node || !childIds.length) return;
      state.viewStack.push(node.id);
      renderCurrentView();
    }
    function render(data, announce = false) {
      const previous = state.data;
      state.data = data;
      $("projectName").textContent = data.projects.length === 1 ? data.projects[0].name : "Project Portfolio";
      $("updated").textContent = `台帳更新 ${time(data.ledgerUpdatedAt)} · 表示更新 ${time(data.generatedAt)}`;
      $("completion").textContent = `${data.summary.done} / ${data.summary.total}`;
      $("projectEta").textContent = time(data.summary.eta.likely);
      $("confidence").textContent =
        `${data.summary.confidence.toUpperCase()} · ETA ${data.summary.estimateCoverage}% · 依存 ${data.summary.dependencyEvidence?.coverage ?? 0}%`;
      state.viewStack = state.viewStack.filter(id => data.nodes.some(node => node.id === id));
      renderCurrentView();
      if (state.selectedId && state.paneOpen) openDetail(state.selectedId, true);
      if (announce && previous && previous.ledgerUpdatedAt !== data.ledgerUpdatedAt) {
        showToast(`ロードマップを更新しました · ${time(data.ledgerUpdatedAt)}`);
      }
    }
    async function refresh(announce = false) {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json(), announce);
        $("error").classList.remove("show");
      } catch (error) {
        $("error").textContent = `ロードマップを取得できません: ${error.message}`;
        $("error").classList.add("show");
      }
    }
    function connect() {
      clearTimeout(state.retry);
      state.eventSource?.close();
      const source = new EventSource("/events");
      state.eventSource = source;
      source.addEventListener("connected", () => {
        $("liveDot").classList.add("live");
        $("liveLabel").textContent = "リアルタイム";
      });
      source.addEventListener("roadmap-update", () => refresh(true));
      source.onerror = () => {
        $("liveDot").classList.remove("live");
        $("liveLabel").textContent = "再接続中";
        source.close();
        state.retry = setTimeout(connect, 3000);
      };
    }
    $("backLevel").addEventListener("click", () => {
      state.viewStack.pop();
      renderCurrentView();
    });
    $("closePane").addEventListener("click", () => setPaneOpen(false));
    $("reopenPane").addEventListener("click", () => setPaneOpen(true, true));
    $("detailId").addEventListener("click", async () => {
      if (!state.selectedId) return;
      try {
        await navigator.clipboard.writeText(state.selectedId);
        showToast(`IDをコピーしました · ${state.selectedId}`);
      } catch {
        showToast("IDをコピーできませんでした");
      }
    });
    window.addEventListener("resize", renderCurrentView);
    refresh();
    connect();
    setInterval(() => refresh(false), 15000);
  </script>
</body>
</html>
