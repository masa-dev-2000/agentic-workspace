schemaVersion: 2
canonical: true
contractModel: local-first-capability-v2
contractIdentity:
  legacyIdField: contractFingerprint
  idSemantics: capability-and-version
  contentDigestField: contractContentDigest
dataWriteModes:
  artifact: logical output; persistence additionally requires workspace-write
  append: append-only state and requires state-append
  mutate: owned state mutation and requires state-mutate
  replace: owned state replacement and requires state-mutate
sources:
  local:
    root: .
    namespace: null
    discover: true
    migrationState: local-source
  ai-project-manager:
    root: ${USERPROFILE}/plugins/ai-project-manager/skills
    namespace: ai-project-manager
    discover: true
    migrationState: legacy-packaged
  self-clone:
    root: ${USERPROFILE}/plugins/self-clone/skills
    namespace: self-clone
    discover: true
    migrationState: legacy-packaged
authorityEffects:
  - read
  - workspace-write
  - state-append
  - state-mutate
  - external-propose
  - external-execute
  - destructive
externalCapabilities:
  - {id: image.generate, providerKey: imagegen}
  - {id: memory.episodic.retrieve, providerKey: episodic-memory:remembering-conversations}
  - {id: document.create, providerKey: documents:documents}
  - {id: presentation.create, providerKey: presentations:Presentations}
  - {id: pdf.create, providerKey: pdf:pdf}
  - {id: browser.control, providerKey: browser:control-in-app-browser}
  - {id: email.draft.manage, providerKey: gmail:gmail}
definitions:
  standardFailure: &standardFailure
    maxEquivalentAttempts: 2
    retry: material-change-only
    route: execution.failure.guard
  readOnlyFailure: &readOnlyFailure
    maxEquivalentAttempts: 1
    retry: alternate-evidence-source
    route: human-clarification
  noRetryFailure: &noRetryFailure
    maxEquivalentAttempts: 0
    retry: prohibited
    route: human-decision
  telemetry: &telemetry
    enabled: true
    lifecycle: true
    outcomeEvidence: true
    contentPolicy: metadata-only

skills:
  - key: agent-team-orchestrator
    capability: project.agent-team.orchestrate
    primaryCategory: execution-delegation-routing
    primaryResponsibility: 'Keep one root orchestrator, coordinate bounded independent agents from persistent PM ledger state, verify returned artifacts, and refill only safe eligible work.'
    entrypoint: adaptive
    invocationPolicy: implicit
    delegatesTo: []
    stateOwner: agent-team-orchestrator
    secondaryCapabilities: []
    source: local
    path: agent-team-orchestrator
    exposure: {surface: public, invocation: implicit, migrationState: local-source}
    responsibility: Keep one root orchestrator, coordinate bounded independent agents from persistent PM ledger state, verify returned artifacts, and refill only safe eligible work.
    nonGoals: [let subagents self-assign or spawn successors, infer completion from agent status, automatically route production destructive financial legal or public work]
    triggers:
      positive: [parallelize independent PM-ledger tasks, verify agent work and refill safe idle slots]
      negative: [one-off delegation without persistent project state, overlapping write ownership]
    dependencies:
      capabilities: [task.progress.verify, task.route]
      components: [adapter.pm-ledger]
    interfaces:
      inputs: [{name: projectLedger, type: ledger-ref}, {name: eligibleWork, type: task-ref}]
      outputs: [{name: verifiedAssignments, type: report-ref}, {name: executionLeases, type: ledger-ref}]
    authority: {default: deny, effects: [read, state-mutate, external-execute]}
    data:
      reads: [pm-project-state, agent-task-state, completion-evidence]
      writes: [{domain: agent-execution-leases, mode: mutate}]
      ownerOf: [agent-execution-leases]
    completion:
      proof: [each assignment is bounded and non-overlapping, returned work is independently verified, leases and blockers match current ledger state]
      verifier: capability:task.progress.verify
      acceptedEvidence: [pm-verified-task, artifact, validate, authority]
    failure: *standardFailure
    telemetry: *telemetry
    evals: [single-orchestrator, bounded-write-ownership, verified-refill, unsafe-work-exclusion]
    maturity: alpha
    version: 1.0.0
    contractFingerprint: contract-v2:project.agent-team.orchestrate@1.0.0
    contractContentDigest: sha256:ebc722526f2b4be89b8c5d019e6dbc8609995b056d9c3e103c486e7d59f09177

